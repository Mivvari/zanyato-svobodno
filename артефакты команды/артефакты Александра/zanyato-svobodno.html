<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Коворкинги ИРИТ-РТФ</title>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      display: none;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Inter", sans-serif;
      color: #111827;
      background: #ffffff;
    }

    button,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      right: 0;

      height: 64px;

      background: rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid #f3f4f6;

      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1280px;
      height: 64px;

      margin: 0 auto;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 8px;
      background: #2563eb;

      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .brand {
      font-size: 14px;
      font-weight: 600;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 32px;

      color: #6b7280;
      font-size: 14px;
    }

    .nav a,
    .nav button {
      background: transparent;
      padding: 0;

      color: inherit;

      cursor: pointer;
    }

    .nav a:hover,
    .nav button:hover {
      color: #111827;
    }

    .hero-section {
      padding-top: 64px;
      padding-left: 32px;
      padding-right: 32px;
      padding-bottom: 32px;
    }

    .hero {
      position: relative;

      min-height: calc(100vh - 80px);

      overflow: hidden;

      border-radius: 24px;

      background: #e5e7eb;
    }

    .hero img {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;

      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.2),
        transparent 60%
      );
    }

    .hero-content {
      position: absolute;
      inset: 0;

      padding: 64px;

      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .glass {
      width: 40%;
      max-width: 520px;

      padding: 40px;

      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 16px;

      background: rgba(255, 255, 255, 0.72);

      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);

      backdrop-filter: blur(20px);
    }

    .live-badge {
      width: fit-content;

      margin-bottom: 24px;
      padding: 4px 12px;

      display: flex;
      align-items: center;
      gap: 8px;

      border: 1px solid #e5e7eb;
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.7);

      color: #6b7280;
      font-size: 12px;
      font-weight: 500;
    }

    .glass h1 {
      margin: 0 0 16px;

      font-family: "DM Serif Display", serif;
      font-size: 48px;
      font-weight: 400;
      line-height: 1.1;
    }

    .hero-description {
      margin: 0 0 32px;

      color: #4b5563;

      font-size: 17px;
      line-height: 1.6;
    }

    .legend {
      margin-bottom: 32px;

      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .legend div {
      display: flex;
      align-items: center;
      gap: 8px;

      color: #374151;
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;

      display: inline-block;

      border-radius: 50%;
    }

    .green {
      background: #34d399;
    }

    .yellow {
      background: #fbbf24;
    }

    .red {
      background: #f87171;
    }

    .primary-button {
      padding: 12px 24px;

      display: inline-flex;
      align-items: center;
      gap: 8px;

      border-radius: 12px;

      background: #2563eb;

      color: white;

      font-size: 14px;
      font-weight: 500;

      cursor: pointer;
    }

    .primary-button:hover {
      background: #1d4ed8;
    }

    .coworkings-section {
      max-width: 1280px;

      margin: 0 auto;
      padding: 80px 24px;
    }

    .section-title {
      margin: 0 0 8px;

      font-family: "DM Serif Display", serif;
      font-size: 36px;
      font-weight: 400;
    }

    .section-subtitle {
      margin: 0 0 32px;

      color: #6b7280;
      font-size: 14px;
    }

    .controls {
      margin-bottom: 40px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-button {
      padding: 8px 16px;

      border: 1px solid #e5e7eb;
      border-radius: 999px;

      background: white;
      color: #4b5563;

      font-size: 14px;

      cursor: pointer;
    }

    .filter-button.active {
      border-color: #2563eb;

      background: #2563eb;
      color: white;
    }

    .sorting {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sorting span {
      color: #9ca3af;
      font-size: 12px;
    }

    .sorting select {
      padding: 8px 12px;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      background: white;

      color: #374151;

      outline: none;
    }

    .grid {
      display: grid;

      grid-template-columns: repeat(4, minmax(0, 1fr));

      gap: 16px;
    }

    .card {
      padding: 20px;

      display: flex;
      flex-direction: column;
      gap: 16px;

      border: 1px solid;
      border-radius: 16px;

      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card.low {
      border-color: #a7f3d0;
      background: #ecfdf5;
    }

    .card.medium {
      border-color: #fde68a;
      background: #fffbeb;
    }

    .card.high {
      border-color: #fecaca;
      background: #fef2f2;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .floor {
      margin: 0 0 4px;

      color: #9ca3af;
      font-size: 12px;
    }

    .card h3 {
      margin: 0;

      font-size: 14px;
      line-height: 1.4;
    }

    .badge {
      margin-left: 8px;
      padding: 4px 10px;

      border-radius: 999px;

      font-size: 12px;
      font-weight: 500;
    }

    .badge.low {
      background: #d1fae5;
      color: #065f46;
    }

    .badge.medium {
      background: #fef3c7;
      color: #92400e;
    }

    .badge.high {
      background: #fee2e2;
      color: #991b1b;
    }

    .people {
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }

    .people strong {
      font-size: 30px;
      line-height: 1;
    }

    .people span {
      margin-bottom: 2px;

      color: #9ca3af;
      font-size: 14px;
    }

    .progress {
      width: 100%;
      height: 6px;

      overflow: hidden;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.08);
    }

    .progress-value {
      height: 100%;

      border-radius: inherit;
    }

    .progress-value.low {
      background: #34d399;
    }

    .progress-value.medium {
      background: #fbbf24;
    }

    .progress-value.high {
      background: #f87171;
    }

    .percentage {
      margin-top: 6px;

      color: #9ca3af;

      font-size: 12px;
    }

    .ai-live-note {
      margin-top: 10px;
      color: #2563eb;
      font-size: 11px;
      font-weight: 600;
    }

    @media (max-width: 1200px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .glass {
        width: 50%;
      }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .glass {
        width: 60%;
      }
    }

    @media (max-width: 700px) {
      .nav {
        display: none;
      }

      .hero-section {
        padding-left: 16px;
        padding-right: 16px;
      }

      .hero-content {
        padding: 20px;
        align-items: flex-end;
      }

      .glass {
        width: 100%;
        padding: 24px;
      }

      .glass h1 {
        font-size: 36px;
      }

      .controls {
        align-items: flex-start;
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">

      <div class="logo-area">
        <div class="logo">РТФ</div>
        <span class="brand">ИРИТ-РТФ</span>
      </div>

      <nav class="nav">
        <button onclick="scrollToTop()">Главная</button>
        <button onclick="scrollToCoworkings()">Коворкинги</button>
      </nav>

    </div>
  </header>

  <section class="hero-section">

    <div class="hero">

      <img
        src="https://images.unsplash.com/photo-1600508774634-4e11d34730e2?w=1600&h=900&fit=crop&auto=format"
        alt="Коворкинг"
      >

      <div class="hero-overlay"></div>

      <div class="hero-content">

        <div class="glass">

          <div class="live-badge" id="last-update" role="status" aria-live="polite">
            <span class="dot green"></span>
            <span id="last-update-text">Последнее обновление: ещё не было</span>
          </div>

          <h1>
            Коворкинги ИРИТ-РТФ
          </h1>

          <p class="hero-description">
            Отслеживание загруженности коворкингов в кампусе
            ИРИТ-РТФ — выбирайте свободное место и работайте комфортно.
          </p>

          <div class="legend">

            <div>
              <span class="dot green"></span>
              Свободно
            </div>

            <div>
              <span class="dot yellow"></span>
              Частично занято
            </div>

            <div>
              <span class="dot red"></span>
              Занято
            </div>

          </div>

          <button
            class="primary-button"
            onclick="scrollToCoworkings()"
          >
            Смотреть коворкинги
            ↓
          </button>

        </div>

      </div>

    </div>

  </section>

  <section
    class="coworkings-section"
    id="coworkings"
  >

    <h2 class="section-title">
      Все коворкинги
    </h2>

    <p
      class="section-subtitle"
      id="count"
    ></p>

    <div class="controls">

      <div class="filters">

        <button
          class="filter-button active"
          data-filter="all"
        >
          Все
        </button>

        <button
          class="filter-button"
          data-filter="low"
        >
          Свободно
        </button>

        <button
          class="filter-button"
          data-filter="medium"
        >
          Частично занято
        </button>

        <button
          class="filter-button"
          data-filter="high"
        >
          Занято
        </button>

      </div>

      <div class="sorting">

        <span>
          Сортировка:
        </span>

        <select id="sort">

          <option value="default">
            По умолчанию
          </option>

          <option value="az">
            А → Я
          </option>

          <option value="za">
            Я → А
          </option>

          <option value="asc">
            Свободные сначала
          </option>

          <option value="desc">
            Занятые сначала
          </option>

          <option value="floor_asc">
            Этаж: 1 → 3
          </option>

          <option value="floor_desc">
            Этаж: 3 → 1
          </option>

        </select>

      </div>

    </div>

    <div
      class="grid"
      id="grid"
    ></div>

  </section>

  <script>
    const coworkings = [
      { id: 1, name: "Атриум А1", people: 0, capacity: 20, floor: "1 этаж", occupancy: "low" },
      { id: 2, name: "Библиотечный зал", people: 18, capacity: 25, floor: "2 этаж", occupancy: "high" },
      { id: 3, name: "Инновационный хаб", people: 11, capacity: 20, floor: "3 этаж", occupancy: "medium" },
      { id: 4, name: "Коворкинг Б2", people: 2, capacity: 15, floor: "1 этаж", occupancy: "low" },
      { id: 5, name: "Коворкинг В3", people: 14, capacity: 18, floor: "2 этаж", occupancy: "high" },
      { id: 6, name: "Лаборатория идей", people: 8, capacity: 16, floor: "3 этаж", occupancy: "medium" },
      { id: 7, name: "Медиазона", people: 3, capacity: 12, floor: "1 этаж", occupancy: "low" },
      { id: 8, name: "Переговорная 101", people: 9, capacity: 10, floor: "1 этаж", occupancy: "high" },
      { id: 9, name: "Пространство Г4", people: 6, capacity: 20, floor: "2 этаж", occupancy: "low" },
      { id: 10, name: "Рабочий зал Д5", people: 12, capacity: 18, floor: "3 этаж", occupancy: "medium" },
      { id: 11, name: "Студенческий клуб", people: 16, capacity: 20, floor: "2 этаж", occupancy: "high" },
      { id: 12, name: "Тихая зона", people: 5, capacity: 18, floor: "2 этаж", occupancy: "low" },
      { id: 13, name: "Учебный центр", people: 10, capacity: 16, floor: "3 этаж", occupancy: "medium" },
      { id: 14, name: "Фокус-рум Е6", people: 7, capacity: 8, floor: "1 этаж", occupancy: "high" },
      { id: 15, name: "Хаб коллабораций", people: 9, capacity: 22, floor: "1 этаж", occupancy: "low" },
      { id: 16, name: "Цифровая студия", people: 13, capacity: 20, floor: "3 этаж", occupancy: "medium" },
      { id: 17, name: "Читальный зал", people: 2, capacity: 30, floor: "2 этаж", occupancy: "low" },
      { id: 18, name: "Штаб проектов", people: 17, capacity: 20, floor: "3 этаж", occupancy: "high" },
      { id: 19, name: "Экспресс-зона", people: 8, capacity: 12, floor: "1 этаж", occupancy: "medium" },
      { id: 20, name: "Открытый зал", people: 6, capacity: 25, floor: "2 этаж", occupancy: "low" },
      { id: 21, name: "Техноточка", people: 7, capacity: 14, floor: "1 этаж", occupancy: "medium" },
      { id: 22, name: "Зал Перспектива", people: 3, capacity: 18, floor: "2 этаж", occupancy: "low" },
      { id: 23, name: "Проектная мастерская", people: 19, capacity: 24, floor: "3 этаж", occupancy: "high" }
    ];

    const labels = {
      low: "Свободно",
      medium: "Частично занято",
      high: "Занято"
    };

    let currentFilter = "all";
    let currentSort = "default";

    const grid = document.getElementById("grid");
    const count = document.getElementById("count");
    const sortSelect = document.getElementById("sort");

    count.textContent =
      coworkings.length + " пространств в кампусе";

    function smoothScrollTo(targetY, duration = 850) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        window.scrollTo(0, targetY);
        return;
      }

      const startY = window.scrollY;
      const distance = targetY - startY;
      const startTime = performance.now();

      function animate(currentTime) {
        const progress = Math.min((currentTime - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        window.scrollTo(0, startY + distance * eased);
        if (progress < 1) requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    }

    function scrollToTop() {
      smoothScrollTo(0);
    }

    function scrollToCoworkings() {
      const section = document.getElementById("coworkings");
      const headerOffset = 80;
      const targetY = section.getBoundingClientRect().top + window.scrollY - headerOffset;
      smoothScrollTo(targetY);
    }

    function render() {

      let list = [...coworkings];

      if (currentFilter !== "all") {
        list = list.filter(
          item => item.occupancy === currentFilter
        );
      }

      if (currentSort === "az") {
        list.sort(
          (a, b) =>
            a.name.localeCompare(b.name, "ru")
        );
      }

      if (currentSort === "za") {
        list.sort(
          (a, b) =>
            b.name.localeCompare(a.name, "ru")
        );
      }

      if (currentSort === "asc") {
        list.sort(
          (a, b) =>
            a.people / a.capacity -
            b.people / b.capacity
        );
      }

      if (currentSort === "desc") {
        list.sort(
          (a, b) =>
            b.people / b.capacity -
            a.people / a.capacity
        );
      }

      if (currentSort === "floor_asc") {
        list.sort(
          (a, b) =>
            parseInt(a.floor) -
            parseInt(b.floor)
        );
      }

      if (currentSort === "floor_desc") {
        list.sort(
          (a, b) =>
            parseInt(b.floor) -
            parseInt(a.floor)
        );
      }

      grid.innerHTML = "";

      list.forEach(item => {

        const percent =
          Math.min(100, Math.round(
            item.people /
            item.capacity *
            100
          ));

        const card =
          document.createElement("article");

        card.className =
          "card " + item.occupancy;

        card.innerHTML = `
          <div class="card-top">

            <div>

              <p class="floor">
                ${item.floor}
              </p>

              <h3>
                ${item.name}
              </h3>

            </div>

            <span
              class="badge ${item.occupancy}"
            >
              ${labels[item.occupancy]}
            </span>

          </div>

          <div class="people">

            <strong>
              ${item.people}
            </strong>

            <span>
              / ${item.capacity} чел.
            </span>

          </div>

          <div>

            <div class="progress">

              <div
                class="progress-value ${item.occupancy}"
                style="width:${percent}%"
              ></div>

            </div>

            <div class="percentage">
              ${percent}% заполнено
            </div>

            ${item.id === 1 ? '<div class="ai-live-note">● Данные обновляются </div>' : ''}

          </div>
        `;

        grid.appendChild(card);
      });
    }

    document
      .querySelectorAll(".filter-button")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".filter-button")
              .forEach(btn =>
                btn.classList.remove("active")
              );

            button.classList.add("active");

            currentFilter =
              button.dataset.filter;

            render();
          }
        );
      });

    sortSelect.addEventListener(
      "change",
      () => {

        currentSort =
          sortSelect.value;

        render();
      }
    );

    render();
  </script>

  <script>
    (() => {
      "use strict";

      const IMAGE_URL = "https://7.46.220.178:8080/shot.jpg";
      const REFRESH_MS = 30000;
      const MIN_CONFIDENCE = 0.5;
      const TF_URL = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js";
      const COCO_URL = "https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js";
      let model;
      let busy = false;

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Не удалось загрузить скрипт"));
          document.head.appendChild(script);
        });
      }

      function loadFrame() {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.crossOrigin = "anonymous";
          const timer = setTimeout(() => reject(new Error("Камера не ответила")), 12000);
          image.onload = () => {
            clearTimeout(timer);
            resolve(image);
          };
          image.onerror = () => {
            clearTimeout(timer);
            reject(new Error("Изображение недоступно"));
          };
          image.src = IMAGE_URL + "?t=" + Date.now();
        });
      }

      async function initialize() {
        try {
          if (!window.tf) await loadScript(TF_URL);
          if (!window.cocoSsd) await loadScript(COCO_URL);
          try {
            await window.tf.setBackend("webgl");
          } catch (_) {
            await window.tf.setBackend("cpu");
          }
          await window.tf.ready();
          model = await window.cocoSsd.load({ base: "mobilenet_v2" });
          await updateCount();
          setInterval(updateCount, REFRESH_MS);
        } catch (error) {
          console.warn(error);
        }
      }

      async function updateCount() {
        if (busy || !model) return;
        busy = true;
        try {
          const frame = await loadFrame();
          const predictions = await model.detect(frame, 100, MIN_CONFIDENCE);
          const people = predictions.filter(item => item.class === "person" && item.score >= MIN_CONFIDENCE);
          const atrium = coworkings.find(item => item.name === "Атриум А1");
          if (atrium) {
            atrium.people = people.length;
            const load = atrium.people / atrium.capacity;
            atrium.occupancy = load <= 0.4 ? "low" : load <= 0.7 ? "medium" : "high";
            render();
          }
          document.getElementById("last-update-text").textContent =
            "Последнее обновление: " + new Date().toLocaleTimeString("ru-RU", {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit"
            });
        } catch (error) {
          console.warn(error);
        } finally {
          busy = false;
        }
      }

      initialize();
    })();
  </script>

</body>
</html>
