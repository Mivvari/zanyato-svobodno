<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Коворкинги ИРИТ-РТФ</title>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
  <script src="people_counter.js" defer></script>


</head>

<body>

  <header class="header">
    <div class="header-inner">

      <div class="logo-area">
        <div class="logo">РТФ</div>
        <span class="brand">ИРИТ-РТФ</span>
      </div>

      <nav class="nav">
        <button onclick="scrollToTop()">Главная</button>
        <button onclick="scrollToCoworkings()">Коворкинги</button>
      </nav>

    </div>
  </header>

  <section class="hero-section">

    <div class="hero">

      <img src="https://images.unsplash.com/photo-1600508774634-4e11d34730e2?w=1600&h=900&fit=crop&auto=format"
        alt="Коворкинг">

      <div class="hero-overlay"></div>

      <div class="hero-content">

        <div class="glass">

          <div class="live-badge" id="last-update" role="status" aria-live="polite">
            <span class="dot green"></span>
            <span id="last-update-text">Последнее обновление: ещё не было</span>
          </div>

          <h1>
            Коворкинги ИРИТ-РТФ
          </h1>

          <p class="hero-description">
            Отслеживание загруженности коворкингов в кампусе
            ИРИТ-РТФ — выбирайте свободное место и работайте комфортно.
          </p>

          <div class="legend">

            <div>
              <span class="dot green"></span>
              Свободно
            </div>

            <div>
              <span class="dot yellow"></span>
              Средняя
            </div>

            <div>
              <span class="dot red"></span>
              Занято
            </div>

          </div>

          <button class="primary-button" onclick="scrollToCoworkings()">
            Смотреть коворкинги
            ↓
          </button>

        </div>

      </div>

    </div>

  </section>

  <section class="coworkings-section" id="coworkings">

    <h2 class="section-title">
      Все коворкинги
    </h2>

    <p class="section-subtitle" id="count"></p>

    <div class="controls">

      <div class="filters">

        <button class="filter-button active" data-filter="all">
          Все
        </button>

        <button class="filter-button" data-filter="low">
          Свободно
        </button>

        <button class="filter-button" data-filter="medium">
          Средняя
        </button>

        <button class="filter-button" data-filter="high">
          Занято
        </button>

      </div>

      <div class="sorting">

        <span>
          Сортировка:
        </span>

        <select id="sort">

          <option value="default">
            По умолчанию
          </option>

          <option value="az">
            А → Я
          </option>

          <option value="za">
            Я → А
          </option>

          <option value="asc">
            Свободные сначала
          </option>

          <option value="desc">
            Занятые сначала
          </option>

          <option value="floor_asc">
            Этаж: 1 → 3
          </option>

          <option value="floor_desc">
            Этаж: 3 → 1
          </option>

        </select>

      </div>

    </div>

    <div class="grid" id="grid"></div>

  </section>


</body>

</html>
